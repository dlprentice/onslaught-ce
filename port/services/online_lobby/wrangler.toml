# SPDX-License-Identifier: GPL-3.0-only
name = "onslaught-ce-lobby"
main = "worker.mjs"
compatibility_date = "2026-11-02"
workers_dev = true
preview_urls = false

[vars]
CE_ENABLED = "false"
CE_SESSION_SECONDS = "14400"
CE_TURN_TTL_SECONDS = "3600"
CE_DAILY_TURN_LIMIT = "200"
CE_MONTHLY_TURN_LIMIT = "2000"
CE_HEARTBEAT_TIMEOUT_MS = "30000"
CE_MAX_ACTIVE_ROOMS = "128"

[observability]
enabled = false

[[durable_objects.bindings]]
name = "LOBBY_DIRECTORY"
class_name = "LobbyDirectory"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyDirectory", "GameRoom"]

[[services]]
binding = "TURN_ISSUER"
service = "onslaught-ce-turn-issuer"
